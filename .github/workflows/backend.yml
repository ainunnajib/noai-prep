name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck tests
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules tests (Firestore emulator)
        working-directory: backend
        run: npx -y firebase-tools@15.33.0 emulators:exec --only firestore --project demo-noai "cd functions && npm run test:rules"
